services:

  jbc-execution:
    image: ethereum/client-go
    user: root
    entrypoint: /root/geth-script.sh
    command:
      - --datadir=/datadir/geth/
      - "--networkid=${NETWORK_ID}"
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/config/jwt.hex
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,engine,web3,net
      - --http.port=8545
      - --http.corsdomain=*
      - --http.vhosts=*
      - --port=30303
    volumes:
      - ./data:/datadir
      - ./geth-script.sh:/root/geth-script.sh
      - ./config:/config
    ports:
      - 30303:30303
      - 8545:8545
    restart: always

  jbc-consensus:
    image: sigp/lighthouse
    user: root
    entrypoint: /root/lighthouse-script.sh
    command:
      - lighthouse
      - beacon
      - --execution-endpoint=http://jbc-execution:8551
      - --execution-jwt=/config/jwt.hex
      - --testnet-dir=/config
      - --disable-peer-scoring
      - --http
      - --http-address=0.0.0.0
      - --http-port=5003
      - --disable-packet-filter
      - --target-peers=${TARGET_PEERS}
      - --enr-address=${NODE_PUBLIC_IP}
      - --enr-udp-port=9101
      - --enr-tcp-port=9101
      - --port=9100
      - --allow-insecure-genesis-sync
#      - --checkpoint-sync-url=https://metrabyte-cl.jibchain.net/
      - --prune-blobs=false
    volumes:
      - ./data/lighthouse:/root/.lighthouse
      - ./config:/config
      - ./lighthouse-script.sh:/root/lighthouse-script.sh
    ports:
      - 0.0.0.0:9101:9101/tcp
      - 0.0.0.0:9101:9101/udp
      - 0.0.0.0:5003:5003/tcp
      - 0.0.0.0:5003:5003/udp

